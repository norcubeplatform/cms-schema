label: Pages
path: src/content/pages
extraKeysPolicy: keep
fields:
  - type: text
    label: No key
  - key: notype
    label: No type
  - key: noitems
    type: array
    label: No items
  - key: nolabel
    type: text
  - key: mystery
    type: wysiwyg
    label: Mystery
  - key: odd
    type: text
    label: Odd
    widget: dial
  - key: body
    type: richtext
    label: Body
    toolbar: [bold]
  - key: caption
    type: text
    label: Caption
    decorative: true
  - key: dup
    type: text
    label: Dup one
  - key: dup
    type: text
    label: Dup two
  - key: kind
    type: select
    label: Kind
    options: []
  - key: tier
    type: select
    label: Tier
    options: [free, pro]
    default: enterprise
  - key: level
    type: select
    label: Level
    options: [a, b]
    default: 3
  - key: tags
    type: multichoice
    label: Tags
    options: [x, y]
    default: [x, z]
  - key: seats
    type: number
    label: Seats
    min: 10
    max: 1
  - key: short
    type: text
    label: Short
    minLength: 10
    maxLength: 5
  - key: few
    type: array
    label: Few
    minItems: 3
    maxItems: 2
    items:
      type: text
      label: Item
  - key: look
    type: text
    label: Look
    regex: 'a(?!b)'
  - key: code
    type: text
    label: Code
    customValidators:
      - type: regex
        pattern: '[unclosed'
      - type: remote
        url: https://example.com
      - type: expression
        condition: { field: ghost, op: eq, value: x }
  - key: shown
    type: text
    label: Shown
    visibleIf: { field: nothere, op: eq, value: x }
  - key: fieldless
    type: text
    label: Fieldless
    visibleIf: { op: eq, value: x }
  - key: like
    type: text
    label: Like
    visibleIf: { field: shown, op: like, value: x }
  - key: matching
    type: text
    label: Matching
    visibleIf: { field: shown, op: matches, value: '[bad' }
  - key: slug
    type: text
    label: Slug
    computed:
      from: headline
      transform: slug
  - key: words
    type: array
    label: Words
    items:
      - key: short
        type: text
        label: Short
      - key: long
        type: paragraph
        label: Long
  - key: cards
    type: array
    label: Cards
    items:
      - type: group
        label: Anonymous card
        fields:
          - key: title
            type: text
            label: Title
      - key: named
        type: group
        label: Named card
        fields:
          - key: title
            type: text
            label: Title
  - key: photo
    type: image
    label: Photo
    storage: pictures
    translatable: true
